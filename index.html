<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Professional authentication page builder for creating customized login, signup, forgot password and OTP pages.">

    <title>Auth Page Builder</title>

    <!-- =====================================================
         APPLICATION STYLES
    ====================================================== -->

    <link rel="stylesheet"
        href="./css/main.css">

    <link rel="stylesheet"
        href="./css/app.css">

    <link rel="stylesheet"
        href="./css/layout.css">

    <link rel="stylesheet"
        href="./css/sidebar.css">

    <link rel="stylesheet"
        href="./css/components.css">

    <link rel="stylesheet"
        href="./css/forms.css">

    <link rel="stylesheet"
        href="./css/customization.css">

    <link rel="stylesheet"
        href="./css/preview.css">

    <link rel="stylesheet"
        href="./css/responsive.css">
</head>


<body>

    <!-- =====================================================
         APPLICATION SHELL
    ====================================================== -->

    <div class="app-shell">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="app-header">

            <div class="app-brand">

                <div class="app-brand-icon">
                    A
                </div>

                <div class="app-brand-content">

                    <h1>
                        Auth Page Builder
                    </h1>

                    <p>
                        Design your authentication experience
                    </p>

                </div>

            </div>


            <div class="header-actions">

                <span class="save-indicator"
                    data-unsaved-indicator>
                    All changes saved
                </span>


                <button type="button"
                    class="header-button secondary"
                    data-action="fullscreen-preview">

                    ⛶

                    <span>
                        Full Preview
                    </span>

                </button>


                <button type="button"
                    class="header-button primary"
                    id="downloadButton"
                    data-action="download-package">

                    ↓

                    <span>
                        Download Package
                    </span>

                </button>

            </div>

        </header>


        <!-- =================================================
             MAIN BUILDER
        ================================================== -->

        <main class="builder-layout">


            <!-- =============================================
                 LEFT CUSTOMIZATION SIDEBAR
            ============================================== -->

            <aside class="customization-sidebar">


                <!-- =========================================
                     PAGE SELECTOR
                ========================================== -->

                <div class="sidebar-page-tabs">

                    <button type="button"
                        class="sidebar-page-tab active"
                        data-builder-page="login">

                        Login

                    </button>


                    <button type="button"
                        class="sidebar-page-tab"
                        data-builder-page="signup">

                        Sign Up

                    </button>


                    <button type="button"
                        class="sidebar-page-tab"
                        data-builder-page="forgotPassword">

                        Forgot Password

                    </button>


                    <button type="button"
                        class="sidebar-page-tab"
                        data-builder-page="otp">

                        OTP

                    </button>

                </div>


                <!-- =========================================
                     CUSTOMIZATION SCROLL AREA
                ========================================== -->

                <div class="customization-scroll">


                    <!-- =====================================
                         PAGE CONTENT
                    ====================================== -->

                    <section class="customization-section customization-accordion open">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="true">

                            <span class="accordion-title">
                                Page Content
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <!-- LOGIN -->

                            <div class="page-specific-control"
                                data-control-page="login">

                                <div class="control-group">

                                    <label>
                                        Login Title
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.login.title"
                                        placeholder="Welcome back">

                                </div>


                                <div class="control-group">

                                    <label>
                                        Login Subtitle
                                    </label>

                                    <textarea rows="3"
                                        data-config-path="pages.login.subtitle"
                                        placeholder="Sign in to continue"></textarea>

                                </div>


                                <div class="control-group">

                                    <label>
                                        Login Button Text
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.login.buttonText"
                                        placeholder="Sign In">

                                </div>

                            </div>


                            <!-- SIGNUP -->

                            <div class="page-specific-control"
                                data-control-page="signup"
                                hidden>

                                <div class="control-group">

                                    <label>
                                        Sign Up Title
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.signup.title"
                                        placeholder="Create account">

                                </div>


                                <div class="control-group">

                                    <label>
                                        Sign Up Subtitle
                                    </label>

                                    <textarea rows="3"
                                        data-config-path="pages.signup.subtitle"
                                        placeholder="Create your account to get started"></textarea>

                                </div>


                                <div class="control-group">

                                    <label>
                                        Sign Up Button Text
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.signup.buttonText"
                                        placeholder="Create Account">

                                </div>

                            </div>


                            <!-- FORGOT PASSWORD -->

                            <div class="page-specific-control"
                                data-control-page="forgotPassword"
                                hidden>

                                <div class="control-group">

                                    <label>
                                        Page Title
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.forgotPassword.title"
                                        placeholder="Forgot password?">

                                </div>


                                <div class="control-group">

                                    <label>
                                        Page Subtitle
                                    </label>

                                    <textarea rows="3"
                                        data-config-path="pages.forgotPassword.subtitle"
                                        placeholder="Enter your email or mobile number"></textarea>

                                </div>


                                <div class="control-group">

                                    <label>
                                        Button Text
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.forgotPassword.buttonText"
                                        placeholder="Send Reset Link">

                                </div>

                            </div>


                            <!-- OTP -->

                            <div class="page-specific-control"
                                data-control-page="otp"
                                hidden>

                                <div class="control-group">

                                    <label>
                                        OTP Title
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.otp.title"
                                        placeholder="Verify your identity">

                                </div>


                                <div class="control-group">

                                    <label>
                                        OTP Subtitle
                                    </label>

                                    <textarea rows="3"
                                        data-config-path="pages.otp.subtitle"
                                        placeholder="Enter the verification code"></textarea>

                                </div>


                                <div class="control-group">

                                    <label>
                                        OTP Button Text
                                    </label>

                                    <input type="text"
                                        data-config-path="pages.otp.buttonText"
                                        placeholder="Verify OTP">

                                </div>

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         LAYOUT
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                Layout
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="control-group">

                                <label>
                                    Page Layout
                                </label>

                                <select data-config-path="layout.type">

                                    <option value="split-left-image">
                                        Split — Image Left
                                    </option>

                                    <option value="split-right-image">
                                        Split — Image Right
                                    </option>

                                    <option value="centered">
                                        Centered Card
                                    </option>

                                    <option value="full-background">
                                        Full Background
                                    </option>

                                </select>

                            </div>


                            <div class="control-group">

                                <div class="range-label-row">

                                    <label>
                                        Image Width
                                    </label>

                                    <span id="imageWidthValue">
                                        50%
                                    </span>

                                </div>


                                <input type="range"
                                    min="20"
                                    max="80"
                                    value="50"
                                    data-config-path="layout.imageWidth"
                                    data-value-target="#imageWidthValue"
                                    data-value-suffix="%">

                            </div>


                            <div class="control-group">

                                <label>
                                    Form Horizontal Position
                                </label>

                                <select data-config-path="layout.formHorizontalAlignment">

                                    <option value="left">
                                        Left
                                    </option>

                                    <option value="center">
                                        Center
                                    </option>

                                    <option value="right">
                                        Right
                                    </option>

                                </select>

                            </div>


                            <div class="control-group">

                                <label>
                                    Form Vertical Position
                                </label>

                                <select data-config-path="layout.formVerticalAlignment">

                                    <option value="top">
                                        Top
                                    </option>

                                    <option value="center">
                                        Center
                                    </option>

                                    <option value="bottom">
                                        Bottom
                                    </option>

                                </select>

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         BACKGROUND
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                Background
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="control-group">

                                <label>
                                    Default Background
                                </label>

                                <div class="asset-grid">

                                    <button type="button"
                                        class="asset-option"
                                        data-background="assets/backgrounds/1000_F_913783737_GrYZ3ld62JdNADjqXinbQ7ogaqWu5Og3.jpg">

                                        Background 1

                                    </button>


                                    <button type="button"
                                        class="asset-option"
                                        data-background="assets/backgrounds/idea-6900632_1280.png">

                                        Background 2

                                    </button>


                                    <button type="button"
                                        class="asset-option"
                                        data-background="assets/backgrounds/OIP (3).webp">

                                        Background 3

                                    </button>

                                </div>

                            </div>


                            <div class="control-group">

                                <label class="upload-label">

                                    <span>
                                        Upload Background
                                    </span>

                                    <input type="file"
                                        accept="image/*"
                                        data-upload-type="background"
                                        data-upload-preview="#backgroundUploadPreview"
                                        data-file-name-target="#backgroundFileName">

                                </label>


                                <img id="backgroundUploadPreview"
                                    class="upload-preview"
                                    alt="Background preview"
                                    hidden>


                                <span id="backgroundFileName"
                                    class="file-name">
                                </span>

                            </div>


                            <div class="control-group">

                                <label>
                                    Background Color
                                </label>

                                <input type="color"
                                    data-config-path="background.color">

                            </div>


                            <div class="control-group">

                                <label>
                                    Background Position
                                </label>

                                <select data-config-path="background.position">

                                    <option value="center">
                                        Center
                                    </option>

                                    <option value="top">
                                        Top
                                    </option>

                                    <option value="bottom">
                                        Bottom
                                    </option>

                                    <option value="left">
                                        Left
                                    </option>

                                    <option value="right">
                                        Right
                                    </option>

                                </select>

                            </div>


                            <div class="control-group">

                                <label>
                                    Background Size
                                </label>

                                <select data-config-path="background.size">

                                    <option value="cover">
                                        Cover
                                    </option>

                                    <option value="contain">
                                        Contain
                                    </option>

                                    <option value="auto">
                                        Original
                                    </option>

                                </select>

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Overlay
                                </label>

                                <input type="checkbox"
                                    data-config-path="background.overlayEnabled">

                            </div>


                            <div class="control-group">

                                <label>
                                    Overlay Color
                                </label>

                                <input type="color"
                                    data-config-path="background.overlayColor">

                            </div>


                            <div class="control-group">

                                <div class="range-label-row">

                                    <label>
                                        Overlay Opacity
                                    </label>

                                    <span id="overlayOpacityValue">
                                        40%
                                    </span>

                                </div>


                                <input type="range"
                                    min="0"
                                    max="100"
                                    data-config-path="background.overlayOpacity"
                                    data-value-target="#overlayOpacityValue"
                                    data-value-suffix="%">

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         BRANDING
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                Branding & Logo
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="control-group">

                                <label>
                                    Default Logo
                                </label>

                                <div class="asset-grid">

                                    <button type="button"
                                        class="asset-option"
                                        data-logo="assets/logos/1000_F_913783737_GrYZ3ld62JdNADjqXinbQ7ogaqWu5Og3.jpg">

                                        Logo 1

                                    </button>


                                    <button type="button"
                                        class="asset-option"
                                        data-logo="assets/logos/idea-6900632_1280.png">

                                        Logo 2

                                    </button>


                                    <button type="button"
                                        class="asset-option"
                                        data-logo="assets/logos/OIP (4).webp">

                                        Logo 3

                                    </button>

                                </div>

                            </div>


                            <div class="control-group">

                                <label class="upload-label">

                                    <span>
                                        Upload Logo
                                    </span>

                                    <input type="file"
                                        accept="image/*"
                                        data-upload-type="logo"
                                        data-upload-preview="#logoUploadPreview"
                                        data-file-name-target="#logoFileName">

                                </label>


                                <img id="logoUploadPreview"
                                    class="upload-preview logo-upload-preview"
                                    alt="Logo preview"
                                    hidden>


                                <span id="logoFileName"
                                    class="file-name">
                                </span>

                            </div>


                            <div class="control-group">

                                <div class="range-label-row">

                                    <label>
                                        Logo Size
                                    </label>

                                    <span id="logoSizeValue">
                                        64px
                                    </span>

                                </div>


                                <input type="range"
                                    min="24"
                                    max="160"
                                    data-config-path="branding.logoSize"
                                    data-value-target="#logoSizeValue"
                                    data-value-suffix="px">

                            </div>


                            <div class="control-group">

                                <label>
                                    Logo Shape
                                </label>

                                <select data-config-path="branding.logoShape">

                                    <option value="square">
                                        Square
                                    </option>

                                    <option value="rounded">
                                        Rounded
                                    </option>

                                    <option value="circle">
                                        Circle
                                    </option>

                                    <option value="ellipse">
                                        Ellipse
                                    </option>

                                </select>

                            </div>


                            <div class="control-group">

                                <label>
                                    Logo Position
                                </label>

                                <select data-config-path="branding.logoPosition">

                                    <option value="left">
                                        Left
                                    </option>

                                    <option value="center">
                                        Center
                                    </option>

                                    <option value="right">
                                        Right
                                    </option>

                                </select>

                            </div>


                            <div class="switch-control">

                                <label>
                                    Logo Background
                                </label>

                                <input type="checkbox"
                                    data-config-path="branding.logoBackgroundEnabled">

                            </div>


                            <div class="control-group">

                                <label>
                                    Logo Background Color
                                </label>

                                <input type="color"
                                    data-config-path="branding.logoBackgroundColor">

                            </div>


                            <div class="control-group">

                                <label>
                                    Brand Name
                                </label>

                                <input type="text"
                                    placeholder="Your Brand"
                                    data-config-path="branding.brandName">

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         LOGIN AUTHENTICATION
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                Authentication
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="switch-control">

                                <label>
                                    Enable Email Login
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.emailEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Mobile Login
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.mobileEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Password Login
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.passwordEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable OTP Login
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.otpEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Remember Me
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.rememberMeEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Forgot Password
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.forgotPasswordEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Sign Up
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.login.signupEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable WhatsApp OTP
                                </label>

                                <input type="checkbox"
                                    data-config-path="authentication.otp.whatsappEnabled">

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         SIGNUP FIELDS
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                Sign Up Fields
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="switch-control">

                                <label>
                                    Full Name
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.signup.fields.fullName">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Username
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.signup.fields.username">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Email
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.signup.fields.email">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Mobile Number
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.signup.fields.mobile">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Password
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.signup.fields.password">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Confirm Password
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.signup.fields.confirmPassword">

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         OTP SETTINGS
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                OTP Settings
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="control-group">

                                <label>
                                    OTP Length
                                </label>

                                <select data-config-path="pages.otp.length">

                                    <option value="4">
                                        4 Digits
                                    </option>

                                    <option value="6">
                                        6 Digits
                                    </option>

                                    <option value="8">
                                        8 Digits
                                    </option>

                                </select>

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Resend OTP
                                </label>

                                <input type="checkbox"
                                    data-config-path="pages.otp.resendEnabled">

                            </div>


                            <div class="control-group">

                                <label>
                                    Resend Button Text
                                </label>

                                <input type="text"
                                    data-config-path="pages.otp.resendText"
                                    placeholder="Resend OTP">

                            </div>


                            <div class="control-group">

                                <label>
                                    Resend Delay (seconds)
                                </label>

                                <input type="number"
                                    min="10"
                                    max="300"
                                    step="1"
                                    data-config-path="pages.otp.resendSeconds">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable Email OTP
                                </label>

                                <input type="checkbox"
                                    data-config-path="authentication.otp.emailEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable SMS OTP
                                </label>

                                <input type="checkbox"
                                    data-config-path="authentication.otp.smsEnabled">

                            </div>


                            <div class="switch-control">

                                <label>
                                    Enable WhatsApp OTP
                                </label>

                                <input type="checkbox"
                                    data-config-path="authentication.otp.whatsappEnabled">

                            </div>


                        </div>

                    </section>


                    <!-- =====================================
                         CARD
                    ====================================== -->

                    <section class="customization-section customization-accordion">

                        <button type="button"
                            class="accordion-header"
                            data-accordion-trigger
                            aria-expanded="false">

                            <span class="accordion-title">
                                Authentication Card
                            </span>

                            <span class="accordion-arrow">
                                ▾
                            </span>

                        </button>


                        <div class="accordion-content">


                            <div class="switch-control">

                                <label>
                                    Enable Card
                                </label>

                                <input type="checkbox"
                                    data-config-path="card.enabled">

                            </div>


                            <div class="control-group">

                                <label>
                                    Card Background
                                </label>

                                <input type="color"
                                    data-config-path="card.backgroundColor">

                            </div>


                            <div class="control-group">

                                <div class="range-label-row">

                                    <label>
                                        Transparency
                                    </label>

                                    <span id="cardOpacityValue">
                                        100%
                                    </span>

                                </div>


                                <input type="range"
                                    min="0"
                                    max="100"
                                    data-config-path="card.opacity"
                                    data-value-target="#cardOpacityValue"
                                    data-value-suffix="%">

                            </div>


                            <div class="control-group">

                                <div class="range-label-row">

                                    <label>
                                        Card Width
                                    </label>

                                    <span id="cardWidthValue">
                                        460px
                                    </span>

                                </div>


                                <input type="range"
                                    min="280"
                                    max="700"
                                    data-config-path="card.width"
                                    data-value-target="#cardWidthValue"
                                    data-value-suffix="px">

                            </div>


                            <div class="control-group">

                                <div class="range-label-row">

                                    <label>
