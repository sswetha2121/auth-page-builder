<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="35%" stop-color="#1c2541" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b132b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="100%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad2)" />
  <rect width="100%" height="100%" fill="url(#glowBlue)" />

  <!-- Smooth Flowing Abstract Waves -->
  <path d="M-100,300 C300,150 700,500 1200,350 C1700,200 1900,450 2100,400 L2100,1200 L-100,1200 Z" fill="url(#waveGrad1)" />
  <path d="M-100,550 C400,350 800,750 1300,500 C1800,250 1950,600 2100,550 L2100,1200 L-100,1200 Z" fill="url(#waveGrad2)" />
  <path d="M-100,800 C350,650 750,950 1250,750 C1750,550 1900,850 2100,800 L2100,1200 L-100,1200 Z" fill="#0f172a" fill-opacity="0.4" />

  <!-- Subtle Shimmer Details -->
  <circle cx="850" cy="320" r="280" fill="#60a5fa" opacity="0.12" filter="blur(50px)" />
  <circle cx="200" cy="700" r="220" fill="#38bdf8" opacity="0.08" filter="blur(40px)" />
</svg>
