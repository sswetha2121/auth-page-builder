<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#001220" />
    </linearGradient>
    <linearGradient id="cyberBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="isometricGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 40 L 80 80 Z" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <path d="M 0 0 L 80 40 L 0 80 Z" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#cyberBg)" />
  <rect width="100%" height="100%" fill="url(#isometricGrid)" />

  <!-- Glowing Digital Beams & Circuits -->
  <g stroke="url(#cyberBeam)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 100 900 L 400 900 L 600 700 L 950 700 L 1100 550 L 1500 550 L 1700 350 L 1920 350" />
    <path d="M 200 1080 L 500 780 L 850 780 L 1050 580 L 1350 580 L 1600 330 L 1800 330" opacity="0.4" />
    <path d="M 0 400 L 350 400 L 550 200 L 900 200 L 1150 450 L 1400 450" opacity="0.5" />
  </g>

  <!-- Node Dots -->
  <circle cx="600" cy="700" r="4" fill="#00f2fe" />
  <circle cx="1100" cy="550" r="5" fill="#38bdf8" />
  <circle cx="1500" cy="550" r="4" fill="#00f2fe" />
  <circle cx="1700" cy="350" r="6" fill="#4facfe" />
  <circle cx="550" cy="200" r="5" fill="#38bdf8" />

  <!-- Ambient Glows -->
  <circle cx="1100" cy="550" r="280" fill="#0284c7" opacity="0.15" filter="blur(60px)" />
  <circle cx="400" cy="800" r="220" fill="#00f2fe" opacity="0.1" filter="blur(50px)" />
</svg>
