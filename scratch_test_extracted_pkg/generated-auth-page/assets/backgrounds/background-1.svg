<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
    <radialGradient id="radialAccent" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad1)" />
  <rect width="100%" height="100%" fill="url(#radialAccent)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Geometric Polygonal Network -->
  <g stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.35" fill="none">
    <polygon points="200,100 450,180 380,420 120,320" fill="url(#polyGrad)" />
    <polygon points="450,180 800,120 720,380 380,420" fill="url(#polyGrad)" opacity="0.8" />
    <polygon points="720,380 1100,280 980,580 620,520" fill="url(#polyGrad)" opacity="0.6" />
    <polygon points="380,420 620,520 480,820 180,680" fill="url(#polyGrad)" opacity="0.9" />
    <polygon points="620,520 980,580 860,920 480,820" fill="url(#polyGrad)" opacity="0.7" />
    <polygon points="980,580 1420,480 1320,860 860,920" fill="url(#polyGrad)" opacity="0.5" />
    <polygon points="1100,280 1560,180 1420,480" fill="url(#polyGrad)" opacity="0.6" />
    <polygon points="1420,480 1820,380 1740,780 1320,860" fill="url(#polyGrad)" opacity="0.7" />
  </g>

  <!-- Tech Accent Nodes -->
  <circle cx="450" cy="180" r="5" fill="#38bdf8" />
  <circle cx="380" cy="420" r="6" fill="#06b6d4" />
  <circle cx="620" cy="520" r="7" fill="#60a5fa" />
  <circle cx="980" cy="580" r="5" fill="#38bdf8" />
  <circle cx="1420" cy="480" r="6" fill="#0ea5e9" />
  <circle cx="480" cy="820" r="5" fill="#3b82f6" />
  <circle cx="860" cy="920" r="6" fill="#06b6d4" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="200" r="180" fill="#0284c7" opacity="0.12" filter="blur(40px)" />
  <circle cx="1400" cy="400" r="260" fill="#4f46e5" opacity="0.15" filter="blur(60px)" />
</svg>
